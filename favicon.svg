<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="35%" stop-color="#FFF3CD"/>
      <stop offset="70%" stop-color="#E6C280"/>
      <stop offset="100%" stop-color="#C29B48"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6C280" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#E6C280" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E6C280" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Obsidian Shield -->
  <rect width="64" height="64" rx="16" fill="#0D0F12"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Ambient Gold Halo -->
  <circle cx="32" cy="32" r="26" fill="url(#halo)"/>
  <!-- Orbiting Celestial Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5"/>
  <!-- Central Architectural Monogram: Stylized H & M Geometric Luxury Glyphs -->
  <path d="M19 19 V45 M19 32 H31 M31 19 V45" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 45 V19 L39 31 L45 19 V45" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Celestial Sparkle Star -->
  <circle cx="32" cy="11" r="1.5" fill="#FFF3CD"/>
  <circle cx="32" cy="53" r="1.5" fill="#E6C280"/>
  <circle cx="11" cy="32" r="1.5" fill="#E6C280"/>
  <circle cx="53" cy="32" r="1.5" fill="#FFF3CD"/>
</svg>
